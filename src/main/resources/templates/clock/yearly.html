<html layout:decorate="~{layout_page}" xmlns:layout="http://www.w3.org/1999/xhtml">
<head>
  <style>
      .wj-header {
          text-align: center !important;
      }

  </style>

</head>

<th:block layout:fragment="content">
  <div class="layout-contents">
    <!-- Page Title -->
    <div class="page-title-wrap">
      <div class="left">
        <h2>연차관리</h2>
        <a title="북마크" class="bookmark toggle">
          내메뉴
        </a>
      </div>
      <ul class="page-navi">
        <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
        <li>근태현황</li>
        <li>연차관리</li>
      </ul>
    </div>

    <section class="section">
      <div class="section-top">
        <div class="search-wrap">
          <dl>
            <dt>
              <label>조회년도</label>
            </dt>
            <dd>
              <select id="year" name="year">
              </select>
            </dd>
          </dl>

          <dl>
            <dt>
              <label>기준일자</label>
            </dt>
            <dd>
              <div class="srch-box">
                <input type="month" class="form-control2" id="startdate" name="startdate">
              </div>
            </dd>
          </dl>

          <dl>
            <dt>
              <label for="rtflag">재직구분</label>
            </dt>
            <dd>
              <select style="width: 150px;" id="rtflag" name="rtflag"></select>
            </dd>
          </dl>

          <dl>
            <dt>
              <label>사원명</label>
            </dt>
            <dd>
              <input type="text" class="form-control2" id="name" name="name">
            </dd>
          </dl>

          <dl>
            <dt><span class="eq"></span></dt>
            <dd>
              <li>
                <a class="btn btn-delete" title="검색" id="btnSearch">
                  <img th:src="@{/images/icon/btn-srch.svg}" alt="검색 아이콘">
                  검색
                </a>
              </li>
            </dd>
          </dl>
        </div>
        <div class="button-wrap">
          <ul>
            <li style="display: flex; align-items: center; margin-right: 8px;">
              <label for="regenerate" style="font-size: 12px; white-space: nowrap; cursor: pointer;">
                <input type="checkbox" id="regenerate" name="regenerate" style="vertical-align: middle;">
                기존 생성분까지 다시 계산
              </label>
            </li>
            <li>
              <a class="btn btn-excell" title="연차생성" id="btnCreate">
                <img th:src="@{/images/icon/ico-edit.svg}" alt="연차생성 아이콘">
                연차생성
              </a>
            </li>
            <li>
              <a class="btn btn-excell" title="저장" id="btnSave">
                <img th:src="@{/images/icon/ico-edit.svg}" alt="저장 아이콘">
                저장
              </a>
            </li>
          </ul>
        </div>
      </div> <!--//section-top end -->
      <p style="margin: 4px 0 8px; font-size: 12px; color: #666;">
        산정기준: 회계연도(매년 1월 1일 일괄 발생) &nbsp;|&nbsp;
        잔여 = 이월 + 발생 + 조정 − 사용 &nbsp;|&nbsp;
        「조정일」만 직접 입력할 수 있습니다. 도입 전 사용분은 음수로 넣습니다.
      </p>
      <div class="container-fluid" style="flex-direction: row; gap: 5px">
          <div style="flex: 0 0 50%; max-width: 50%;">
            <p id="selectedItem1"></p>
            <div id="member-grid" style="height: 100%;"></div>
          </div>

          <div style="flex: 0 0 50%; max-width: 50%;">
            <p id="selectedItem2"></p>
            <div id="list-grid" style="height: 100%;"></div>
          </div>
      </div>
    </section>
  </div> <!--//layout-contents end -->

  <footer style="margin-top: 24px;">
    <p>Copyrightⓒ 0000 corp. All rights reserved.</p>
  </footer>

</th:block>
<th:block layout:fragment="scripts">
  <th:block th:replace="/common/columns_setting :: columns_setting"></th:block>
  <script type="text/javascript">
    class YearlyPage {
      constructor() {
        this.viewData = new wijmo.collections.CollectionView();
        this.viewData2 = new wijmo.collections.CollectionView();
        this.grid = null;
        this.grid2 = null;
        /* 'list'   현황 조회 — 저장하면 조정일수만 갱신한다
           'create' 생성 미리보기 — 저장하면 발생행을 만들거나 갱신한다 */
        this.mode = 'list';
        this.createFlag = null;
        this.init();
      }

      init() {
        let _this = this;

        this.grid = new wijmo.grid.FlexGrid('#member-grid', {
          selectionMode: wijmo.grid.SelectionMode.Row,
          headersVisibility: wijmo.grid.HeadersVisibility.Column,
          autoGenerateColumns: false,
          showMarquee: true,
          /* 그리드 전체를 읽기전용으로 두지 않는다. 컬럼별 isReadOnly 로 「조정일」만 열어 둔다.
             잔여를 직접 받지 않는 이유 — 잔여는 이월+발생+조정−사용 으로 늘 다시 계산되므로
             적어 넣어도 휴가 한 건에 덮인다. 그래서 구성요소인 조정일에 입력을 받는다. */
          isReadOnly: false,
          formatItem: (sender, e) => {
            if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) {
              e.cell.style.textAlign = 'center';
            }
            if (e.panel.cellType === wijmo.grid.CellType.Cell) {
              /* 편집중인 칸은 건드리지 않는다. Wijmo 는 편집을 시작할 때 그 칸을 다시 그리면서
                 입력상자를 넣는데, 여기서 innerHTML 을 덮어쓰면 그 입력상자가 통째로 날아간다.
                 그래서 「조정일」에 타이핑이 아예 안 됐다. */
              if (e.cell.getElementsByTagName('input').length > 0) return;
              const col = sender.columns[e.col];
              //소수점1자리까지만
              if (['daynum', 'restnum', 'ewolnum', 'holinum', 'monthnum'].includes(col.binding)) {
                const value = sender.getCellData(e.row, e.col, false);
                if (typeof value === 'number') {
                  e.cell.innerHTML = (value % 1 === 0) ? value.toString() : value.toFixed(1);
                }
              }
              // 편집 가능한 조정일 칸을 눈에 보이게 구분한다
              if (col.binding === 'monthnum') {
                e.cell.style.backgroundColor = '#fffbe6';
              }
            }
          },
          columns: [
            {binding: 'rownum', header: '순번', width: 70, align: 'center', isReadOnly: true},
            {binding: 'person_name', header: '사원명', width: 100, align: 'center', isReadOnly: true},
            {binding: 'jik_id', header: '직위', width: 90, align: 'center', isReadOnly: true},
            {binding: 'rtdate', header: '입사일', width: 110, align: 'center', isReadOnly: true},
            {binding: 'gubun', header: '구분', width: 70, align: 'center', isReadOnly: true},
            {binding: 'ewolnum', header: '이월일', width: 90, align: 'center', isReadOnly: true},
            {binding: 'holinum', header: '발생일', width: 90, align: 'center', isReadOnly: true},
            {
              binding: 'monthnum', header: '조정일', width: 90, align: 'center',
              isReadOnly: false, dataType: wijmo.DataType.Number
            },
            {binding: 'daynum', header: '사용일', width: 90, align: 'center', isReadOnly: true},
            {binding: 'restnum', header: '잔여일', width: 90, align: 'center', isReadOnly: true},
          ],
          itemsSource: this.viewData, // 데이터를 설정할 배열
        });

        // 조정일을 고치면 잔여일이 바로 따라오게 한다 (저장 전에도 결과가 보인다)
        this.grid.cellEditEnded.addHandler((s, e) => {
          const col = s.columns[e.col];
          if (col.binding !== 'monthnum') return;
          const item = s.rows[e.row].dataItem;
          const num = (v) => (v === null || v === undefined || v === '') ? 0 : Number(v) || 0;
          item.restnum = num(item.ewolnum) + num(item.holinum) + num(item.monthnum) - num(item.daynum);
          s.invalidate();
        });


        /* 더블클릭하면 상세를 연다. 다만 「조정일」 칸은 예외다 — 더블클릭은 Wijmo 가
           편집을 시작하는 동작이기도 해서, 그 칸에서까지 상세를 열면 편집이 바로 닫힌다. */
        this.grid.hostElement.addEventListener('dblclick', (e) => {
          let hitTest = this.grid.hitTest(e);
          if (hitTest.cellType === wijmo.grid.CellType.Cell) {
            let col = this.grid.columns[hitTest.col];
            if (col && col.binding === 'monthnum') return;
            let selectedItem = this.grid.rows[hitTest.row].dataItem;
            if (!selectedItem || selectedItem.id === null || selectedItem.id === undefined) return;
            _this.showDetail(selectedItem.id)
          }
        });

        new FlexGridContextMenu(this.grid);
        this.grid.downloadFileName = '사원별근태현황';


        this.grid2 = new wijmo.grid.FlexGrid('#list-grid', {
          selectionMode: wijmo.grid.SelectionMode.Row,
          headersVisibility: wijmo.grid.HeadersVisibility.Column,
          autoGenerateColumns: false,
          showMarquee: true,
          isReadOnly: true,
          formatItem: (sender, e) => {
            if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) {
              e.cell.style.textAlign = 'center';
            }
          },
          /* daynum 이 '기간'과 '사용일' 두 컬럼에 중복 바인딩돼 있었다.
             tb_pb204.daynum 은 그 신청의 일수(= 사용일)이므로 '사용일' 하나로 둔다. */
          columns: [
            {binding: 'rownum', header: '순번', width: 70, align: 'center'},
            {binding: 'worknm', header: '구분', width: 90, align: 'center'},
            {binding: 'reqdate', header: '신청일', width: 110, align: 'center'},
            {binding: 'frdate', header: '시작일', width: 110, align: 'center'},
            {binding: 'todate', header: '종료일', width: 110, align: 'center'},
            {binding: 'ewolnum', header: '이월일', width: 80, align: 'center'},
            {binding: 'holinum', header: '발생일', width: 80, align: 'center'},
            {binding: 'monthnum', header: '조정일', width: 80, align: 'center'},
            {binding: 'daynum', header: '사용일', width: 80, align: 'center'},
            {binding: 'restnum', header: '잔여일', width: 80, align: 'center'},
          ],
          itemsSource: this.viewData2, // 데이터를 설정할 배열
        });

        new FlexGridContextMenu(this.grid2);
        this.grid2.downloadFileName = '근태내역';
      }

      searchMainData() {
        let _this = this;

        let url = '/api/clock/Yearly/read'
        let data = {
          'year': $('#year').val(),
          'name': $('#name').val(),
          'rtflag': $('#rtflag').val(),
          spjangcd: sessionStorage.getItem('spjangcd'),
        }

        let result = AjaxUtil.getSyncData(url, data);
        if (result && result.data) {
          _this.mode = 'list';
          _this.createFlag = null;
          _this.viewData.sourceCollection = result.data;
          _this.viewData2.sourceCollection = [];
          $('#selectedItem1').text('');
        }

      }//searchMainData

      /**
       * 연차·월차 생성 미리계산. 근속 1년 이상은 연차(근속표), 1년 미만은 월차(개근 1개월당 1일,
       * 최대 11일)로 한 번에 계산한다. 예전에는 버튼이 둘로 나뉘어 있었고 조회 직후 바로
       * 저장까지 해버렸다 — 지금은 결과를 그리드에 먼저 보여 주고 「저장」을 눌러야 들어간다.
       *
       * @param createFlag '1' 기존 생성분까지 다시 계산 / '2' 신규만 등록
       */
      create(createFlag) {
        let _this = this;

        let url = '/api/clock/Yearly/Create'
        let data = {
          'year': $('#year').val(),
          'startdate': $('#startdate').val(),
          'name': $('#name').val(),
          'rtflag': $('#rtflag').val(),
          'createFlag': createFlag,
          spjangcd: sessionStorage.getItem('spjangcd'),
        }

        let result = AjaxUtil.getSyncData(url, data);
        if (!result || !result.data) return;

        if (result.data.length === 0) {
          Alert.alert('', createFlag === '2'
            ? '새로 생성할 대상이 없습니다. 이미 생성된 사원까지 다시 계산하려면 「기존 생성분까지 다시 계산」을 선택하세요.'
            : '생성 대상이 없습니다. 입사일이 등록된 재직자가 있는지 확인하세요.');
          return;
        }

        result.data.sort((a, b) => a.rownum - b.rownum);
        _this.mode = 'create';
        _this.createFlag = createFlag;
        _this.viewData.sourceCollection = result.data;
        _this.viewData2.sourceCollection = [];
        $('#selectedItem1').text(
          '생성 미리보기 ' + result.data.length + '건 — 확인 후 「저장」을 누르세요. (저장 전에는 반영되지 않습니다)');
      }

      /**
       * 생성방식을 확인하고 미리계산을 실행한다.
       *
       * 방식은 체크박스로 받는다. 확인창의 [취소]에 재계산을 걸면 Esc·X 로 닫았을 때
       * 어느 쪽이 돌았는지 알 수 없어, 되돌리기 어려운 쪽을 명시적으로 고르게 했다.
       */
      askCreate() {
        let _this = this;
        let year = $('#year').val();
        let regenerate = $('#regenerate').is(':checked');

        let msg = regenerate
          ? year + '년도 연차를 생성합니다.\n\n이미 발생분이 있는 사원까지 발생일수·이월일수를 다시 계산합니다.\n조정일과 그 이력은 그대로 유지됩니다.\n\n계산 결과를 먼저 보여 드리고, 「저장」을 눌러야 반영됩니다.'
          : year + '년도 연차를 생성합니다.\n\n아직 발생분이 없는 사원만 대상입니다.\n\n계산 결과를 먼저 보여 드리고, 「저장」을 눌러야 반영됩니다.';

        Alert.confirm('', msg, function () {
          _this.create(regenerate ? '1' : '2');
        });
      }

      /**
       * 저장. 화면 상태에 따라 보내는 곳이 다르다.
       *   생성 미리보기 상태 → /save      발생행(발생일수·이월일수)을 만들거나 갱신
       *   현황 조회 상태     → /saveAdjust 조정일수만 갱신
       *
       * 「조정일」만 편집 가능하므로, 현황에서 저장하면 조정일 외에는 아무 것도 바뀌지 않는다.
       */
      save() {
        let _this = this;
        if (_this.mode === 'create') {
          _this.saveGenerated();
        } else {
          _this.saveAdjust();
        }
      }

      /** 생성 미리보기 결과를 저장한다 */
      saveGenerated() {
        let _this = this;

        let saveList = _this.viewData.items.filter(item =>
          item.holinum !== null && item.holinum !== undefined && Number(item.holinum) > 0);

        if (saveList.length === 0) {
          Alert.alert('', '저장할 생성 데이터가 없습니다.');
          return;
        }

        let data = {
          spjangcd: sessionStorage.getItem('spjangcd'),
          year: $('#year').val(),
          createFlag: _this.createFlag || '2',
          saveList: saveList
        };

        AjaxUtil.postJsonData('/api/clock/Yearly/save', data, function (res) {
          if (res.success) {
            Alert.alert('', res.message || '저장되었습니다.');
            _this.searchMainData();
          } else {
            Alert.alert('', res.message || '저장에 실패했습니다.');
          }
        });
      }

      /**
       * 조정일수를 저장한다. 발생행이 없는 사원은 서버가 저장하지 않고 이름을 돌려주므로
       * 그 사원들은 연차생성을 먼저 해야 한다고 알려 준다.
       */
      saveAdjust() {
        let _this = this;

        let saveList = _this.viewData.items
          .filter(item => item.id !== null && item.id !== undefined)
          .map(item => ({
            id: item.id,
            person_name: item.person_name,
            monthnum: (item.monthnum === null || item.monthnum === undefined || item.monthnum === '')
              ? 0 : Number(item.monthnum)
          }));

        if (saveList.length === 0) {
          Alert.alert('', '저장할 내용이 없습니다.');
          return;
        }

        let data = {
          spjangcd: sessionStorage.getItem('spjangcd'),
          year: $('#year').val(),
          saveList: saveList
        };

        AjaxUtil.postJsonData('/api/clock/Yearly/saveAdjust', data, function (res) {
          if (!res.success) {
            Alert.alert('', res.message || '저장에 실패했습니다.');
            return;
          }

          let d = res.data || {};
          let msg = (d.saved || 0) + '건의 조정일을 저장했습니다.';

          if (d.notGenerated && d.notGenerated.length > 0) {
            msg += '\n\n연차생성이 안 된 사원은 저장되지 않았습니다 (' + d.notGenerated.length + '명):\n'
                 + d.notGenerated.slice(0, 10).join(', ')
                 + (d.notGenerated.length > 10 ? ' 외' : '')
                 + '\n→ 「연차생성」을 먼저 실행하세요.';
          }
          if (d.outOfRange && d.outOfRange.length > 0) {
            msg += '\n\n입력값이 허용 범위(±999.9)를 넘어 제외했습니다: ' + d.outOfRange.join(', ');
          }
          if (d.remarkEnabled === false) {
            msg += '\n\n(조정 이력은 기록되지 않았습니다 — tb_pb209.remark 컬럼 미적용)';
          }

          Alert.alert('', msg);
          _this.searchMainData();
        });
      }

      showDetail(id) {
        let _this = this;
        let data = {
          'id': id,
          year: $('#year').val(),
          spjangcd: sessionStorage.getItem('spjangcd'),
        };
        let result = AjaxUtil.getSyncData('/api/clock/Yearly/detail', data);

        if (result && result.data != null) {
          _this.viewData2.sourceCollection = result.data;
        }
      }


    }

    let page = null;

    $(document).ready(function (e) {
      //yullinAuth.inspection();
      yullinAuth.removeWriteButton();
      page = new YearlyPage();

      AjaxUtil.fillSelectOptions($('#rtflag'), 'system_code', 'choose', '0', 'rtflag_type');

      const todayYM = CommonUtil.getYYYYMMDD().substring(0, 7);
      $('#startdate').val(todayYM);

      let select = document.getElementById('year');
      let thisYear = new Date().getFullYear();
      for (let y = thisYear; y > thisYear - 5; y--) {
        let opt = document.createElement('option');
        opt.value = y;
        opt.text = y;
        select.appendChild(opt);
      }

      select.addEventListener('change', function () {
        // 현재 선택된 월 가져오기 (기존 값에서 추출)
        let currentMonth = $('#startdate').val().substring(5, 7); // MM만 가져옴
        let selectedYear = this.value;
        let newValue = `${selectedYear}-${currentMonth}`;
        $('#startdate').val(newValue);
      });

      $('#btnSearch').click(function (ex) {
        page.searchMainData();
      });

      $('#btnCreate').click(function (ex) {
        page.askCreate();
      });

      // 예전에는 저장 버튼에 핸들러가 없어 눌러도 아무 일도 일어나지 않았다
      $('#btnSave').click(function (ex) {
        page.save();
      });

      page.searchMainData();
    });
  </script>

</th:block>

</html>
