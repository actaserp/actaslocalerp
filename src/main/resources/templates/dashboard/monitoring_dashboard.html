<html layout:decorate="~{layout_page}">

<head>
    <style>

        [data-ax5grid] [data-ax5grid-container="root"] [data-ax5grid-container="body"] [data-ax5grid-panel] table tr td [data-ax5grid-cellHolder] {
            font-size: 14px;
        }


        /* 1. 최상위 컨테이너 높이 해제 */
        .layout-contents {
            height: auto !important; /* 고정 높이 제거 */
            min-height: 100%; /* 최소한 화면은 채우도록 설정 */
            display: flex;
            flex-direction: column;
            padding-bottom: 40px; /* 마지막 카드 하단 여백 확보 */
        }

        /* 2. 중간 래퍼들의 높이 제약 해제 */
        .tab-wrap, .tab-contents, .row {
            height: auto !important;
            min-height: 1px; /* 부모 height: 100% 자식들이 깨지는 것 방지 */
            display: block !important;
        }

        /* 3. 대시보드 그리드 (3열 유지) */
        .dashboard-grid {
            display: grid !important;
            grid-template-columns: repeat(3, 1fr) !important;
            grid-gap: 20px;
            width: 100%;
            margin-top: 20px;
        }

       /* 4. 카드 디자인 수정 */
    .card {
        background: #ffffff;
        border-radius: 12px;
        border: 1px solid #e1e4e8;
        box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        display: flex;
        flex-direction: column;

        /* [핵심 수정] 높이를 고정합니다. 원하시는 높이로 조절하세요. */
        height: 320px;
        overflow: hidden; /* 전체 카드가 깨지는 것 방지 */
    }

    .card-header {
        background-color: white;
        padding: 18px 20px;
        border-bottom: 1px solid #f1f3f5;
        flex-shrink: 0; /* 헤더 크기가 줄어들지 않도록 설정 */
    }

    .card-header strong {
        font-size: 16px;
        font-weight: 800;
        color: #212529;
        letter-spacing: -0.5px;
    }

    /* 5. 카드 내부 본문 스크롤 설정 */
    .card-body {
        padding: 20px;
        flex: justify-content: space-around; /* 남은 공간을 차지하도록 설정 */
        align-items: flex-start;
        overflow-x: auto; overflow-y: auto;
        display: flex; /* 중앙 정렬을 풀고 내용이 위에서부터 쌓이게 변경 */
    }

    /* 스크롤바 디자인 (선택 사항: 더 깔끔하게 보이게 함) */
    .card-body::-webkit-scrollbar {
        width: 6px;
    }
    .card-body::-webkit-scrollbar-thumb {
        background-color: #e9ecef;
        border-radius: 10px;
    }
    .card-body::-webkit-scrollbar-track {
        background: transparent;
    }

    .chart-container {
    position: relative;
    height: 150px; /* 게이지 차트가 적절히 보일 높이 */
    width: 100%;
    }

    /* 그리드 전용 패딩 클래스 */
    .card-body.grid-padding {
        padding: 15px 25px; /* 상하 15px, 좌우 25px로 너비를 조절 */
    }

    /* 그리드 호스트 스타일 보정 */
    .grid-host {
        width: 100%;
        height: 100%;
        border: 1px solid #e1e4e8; /* 그리드 테두리를 살짝 주면 더 깔끔합니다 */
        border-radius: 4px;      /* 모서리 살짝 굴림 */
    }


#adminUsageGrid .wj-header {
    background-color: #8c8c8c !important; /* 이미지와 유사한 회색 헤더 */
    color: #ffffff !important;
    font-weight: bold;
}

/* 초과 사용 시 텍스트 강조 */
.usage-excess {
    color: #ff0000 !important;
    font-weight: bold;
}


        /* 반응형 설정: 창이 줄어들면 1열로 */
        @media (max-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: 1fr !important;
            }
        }
    </style>
</head>
<th:block layout:fragment="content">
    <div class="layout-contents">
        <div class="page-title-wrap">
            <div class="left">
                <h2>Dash Board</h2>
                <a title="북마크" class="bookmark toggle">내 메뉴</a>
            </div>
            <ul class="page-navi">
                <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
                <li>모니터링</li>
                <li>대쉬보드</li>
            </ul>
        </div>

        <div class="tab-wrap">
            <div class="tab-contents">
                <div class="row">
                    <div class="content-wrap dashboard-grid">

                        <div class="card">
                            <div class="card-header"><strong>VM 사용량(vCPU 및 RAM 가용성)</strong></div>
                            <div class="card-body" style="display: flex; justify-content: space-around; align-items: flex-start; overflow-x: auto; overflow-y: auto;">

                                <div class="vm-usage-item" style="flex: 1; text-align: center; padding: 10px; min-width: 150px;">
                                    <div style="position: relative; height: 140px; width: 100%;">
                                        <canvas id="cpuChart"></canvas>
                                        <div id="cpuValue" style="position: absolute; top: 65%; left: 50%; transform: translate(-50%, -50%); font-size: 20px; font-weight: 800; color: #3b82f6;">0%</div>
                                    </div>
                                    <div style="font-weight: 800; color: #333; margin-top: -10px;">vCPU</div>
                                </div>

                                <div class="vm-usage-item" style="flex: 1; text-align: center; padding: 10px; min-width: 150px;">
                                    <div style="position: relative; height: 140px; width: 100%;">
                                        <canvas id="ramChart"></canvas>
                                        <div id="ramValue" style="position: absolute; top: 65%; left: 50%; transform: translate(-50%, -50%); font-size: 20px; font-weight: 800; color: #10b981;">0%</div>
                                    </div>
                                    <div style="font-weight: 800; color: #333; margin-top: -10px;">RAM</div>
                                </div>

                            </div>
                        </div>

                        <div class="card">
                            <div class="card-header"><strong>api 콜 횟수(고객사별)</strong></div>
                            <div class="card-body grid-padding">
                                <div id="apiCallGrid" class="grid-host"></div>
                            </div>
                        </div>

                        <div class="card">
                            <div class="card-header"><strong>요금제별 이용현황</strong></div>
                            <div class="card-body grid-padding">
                                <div id="ratePlanGrid" class="grid-host"></div>
                            </div>
                        </div>

                        <div class="card">
                            <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
                                <strong>월별 가입현황</strong>

                                <input type="month" id="monthPicker"
                                       style="padding: 5px 10px;
                      border: 1px solid #e1e4e8;
                      border-radius: 6px;
                      font-size: 13px;
                      font-family: inherit;
                      color: #333;
                      outline: none;
                      cursor: pointer;">
                            </div>
                            <div class="card-body grid-padding">
                                <div id="monthlySignupGrid" class="grid-host"></div>
                            </div>
                        </div>

                        <div class="card">
                            <div class="card-header"><strong>네트워크 이용내역</strong></div>
                            <div class="card-body">
                                <div style="width: 100%; height: 100%; position: relative;">
                                    <canvas id="networkChart"></canvas>
                                </div>
                            </div>
                        </div>

                        <div class="card">
                            <div class="card-header"><strong>요청사항</strong></div>
                            <div class="card-body grid-padding">
                                <div id="requestGrid" class="grid-host"></div>
                            </div>
                        </div>
                    </div>

                    <div class="row" style="margin-top: 20px;">
                        <div class="card admin-only-section" style="height: auto; min-height: 400px;">
                            <div class="card-header" style="display: flex; justify-content: space-between; align-items: center; background-color: #f8f9fa;">
                                <strong>[관리자 전용] 실시간 사용량 및 정산 현황</strong>
                                <div class="header-tools">
                                    <button class="btn-excel" style="padding: 5px 12px; background: #28a745; color: white; border: none; border-radius: 4px; font-size: 12px; cursor: pointer;">
                                        엑셀 다운로드
                                    </button>
                                </div>
                            </div>
                            <div class="card-body grid-padding">
                                <div id="adminUsageGrid" class="grid-host" style="min-height: 350px;"></div>
                            </div>
                        </div>
                    </div>


                </div>
            </div>
        </div>
    </div>
</th:block>

            // 게이지 차트 생성 공통 함수 (차트 부분)
            createGaugeChart(canvasId, color) {
                const canvas = document.getElementById(canvasId);

                return new Chart(ctx, {
                    type: 'doughnut',
                    data: { datasets: [{ data: [0, 100], backgroundColor: [color, '#f1f3f5'], borderWidth: 0 }] },

                        rotation: -90, circumference: 180, cutout: '75%',
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { display: false }, tooltip: { enabled: false } }
                    }
                });
